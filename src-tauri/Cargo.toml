[package]
name = "duet"
version = "0.1.0"
description = "对奏 Duet — 专注内容横向对比的本地优先应用"
authors = ["xiaoyaomoyor"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/xiaoyaomoyor/duet"
edition = "2021"
# WebView2 与 Tauri 2 的 MSRV
rust-version = "1.77"

[lib]
name = "duet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# 单实例：双击 .duet 文件时应当在已有窗口里打开，而不是再开一个应用
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# HTTP 客户端：fetch_remote 命令用它绕过浏览器 CORS
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[features]
# 由 tauri-build 在编译时注入（custom-protocol 用于生产打包）
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# 桌面版体积优化：安装包远小于 Electron 是本项目选 Tauri 的理由之一（§5 T14）
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
