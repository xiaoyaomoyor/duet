</style></head><body><main class="review"><div class="review-head"><div><div class="eyebrow">Duet / Web experience blueprint</div><h1>一场有节奏、有证据的对比。</h1></div><div class="review-note">A 的试听舞台 × B 的数据排版<br>规划原型 · 所有素材、分数与评价均为虚构示例，无真实音频。</div></div><div class="controls"><div class="directions"><button data-mode="stage" aria-pressed="true">展示视图</button><button data-mode="editor" aria-pressed="false">统一编辑器</button><button data-count="2" aria-pressed="true">2 方</button><button data-count="6" aria-pressed="false">6 方</button></div><div class="modes"><label style="font-size:12px;color:#a6acb4">项目外观 <select id="appearance"><option value="dark">墨色舞台</option><option value="paper">纸白阅读</option></select></label></div></div><div class="frame" id="frame"></div><div class="st-foot"><div><b>同一个项目，三种观看距离</b>六方总览、重点双人对比、单项放大共用素材与评测数据。不会因为放大就复制或改写评测内容。</div><div><b>样本作为完整作品切换</b>选择「作品 02」时，名称、歌词、封面示意与对应评分一起更新。样本选择属于演示会话，保存默认选择是另一个动作。</div><div><b>按键推动演示</b><span class="legend"><span><kbd>←</kbd> <kbd>→</kbd> 上一步 / 下一步</span><span><kbd>空格</kbd> 下一步</span><span><kbd>P</kbd> 试听焦点</span></span>演示只改变当前观看状态，不写入项目正文。</div></div></main><script>
let state={mode:'stage',count:2,scene:1,appearance:'dark',selection:{},focus:null,playing:null,currentObject:0,tab:'内容',caseIndex:0};
const names=['Suno','Lyria','工具 C','工具 D','工具 E','工具 F'];const letters=['A','B','C','D','E','F'];const chapters=['共享命题','作品试听','维度比较','评测结论'];const cases=['城市雨夜','旷野清晨'];const tones=['#d4b78a','#92bcbf','#afb3c7','#c7a5ad','#b7bd91','#b3a8c5'];
function selected(i){return state.selection[state.caseIndex+':'+i]||0}function title(i){return (state.caseIndex?'晨光漫游':'夜雨未寄')+(selected(i)?' · 另一版':'')}function lyric(i){return state.caseIndex?(selected(i)?'风掠过山脊，唤醒沉睡的光。':'朝阳穿过旷野，风带来新的方向。'):(selected(i)?'城市把心事，藏进每一滴雨。':'雨落在安静的城市，霓虹映着未寄出的诗。')}function score(i,r=0){return (8.1+((i+r+selected(i))%5)*.1).toFixed(1)}
function wave(n=47){return '<div class="wave" aria-hidden="true">'+Array.from({length:n},(_,i)=>'<i style="--h:'+Math.round(5+Math.abs(Math.sin(i*1.4)*Math.cos(i*.26))*24)+'"></i>').join('')+'</div>'}
function brand(){return '<span class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>对奏 <span style="font-size:10px;font-weight:400;letter-spacing:2px">DUET</span></span>'}
function head(){return '<header class="stage-head">'+brand()+'<nav class="stage-nav" aria-label="演示章节">'+chapters.map((x,i)=>'<button data-scene="'+i+'" class="'+(i===state.scene?'active':'')+'">0'+(i+1)+' '+x+'</button>').join('')+'</nav><span class="stage-meta">AI MUSIC / STUDY 01</span></header>'}
function heading(){return '<div class="story-heading"><div><div class="kicker">0'+(state.scene+1)+' / '+chapters[state.scene]+'</div><h2>'+['相同的命题，多种诠释。','同一段灵感，听见不同回响。','把听感，放回同一把标尺。','用证据解释差异，让偏好有迹可循。'][state.scene]+'</h2></div><div><div class="case-line"><span>测试题</span><b>'+cases[state.caseIndex]+'</b><button class="step-btn" data-case>切换</button></div><p style="margin-top:10px">中文独立流行 / 相同歌词与风格要求<br>所有评语与数字均为版式示例</p></div></div>'}
function art(i){return '<div class="album '+(i%2?'b-art':'')+'"><div class="album-art"><div class="arc" style="transform:translateX('+(selected(i)?-70:0)+'px)"></div></div><span class="album-index">'+letters[i]+'</span><div class="album-label"><div class="album-title">'+title(i)+'</div><div class="stage-meta">'+cases[state.caseIndex]+' / 作品 0'+(selected(i)+1)+'</div></div></div>'}
function participant(i,six=false){return '<article class="competitor '+(state.playing===i?'focus':'')+'" style="--tone:'+tones[i]+'"><div class="tool-line"><span class="tool-name">'+names[i]+'</span><span class="pill"><i class="dot"></i>'+letters[i]+' · '+(state.playing===i?'当前试听':'样本')+'</span>'+(six?'<button class="zoom" data-focus="'+i+'">放大</button>':'')+'</div>'+art(i)+'<div class="track"><button class="listen '+(state.playing===i?'active':'')+'" data-play="'+i+'" aria-label="试听 '+letters[i]+' 示意">'+(state.playing===i?'Ⅱ':'▶')+'</button>'+wave(six?26:47)+'<span class="time">'+(selected(i)?'00:00 / 02:26':'00:00 / 02:18')+'</span></div><div class="lyric">'+lyric(i)+'</div><label class="sample-select">当前作品 <select data-sample="'+i+'"><option value="0" '+(!selected(i)?'selected':'')+'>作品 01</option><option value="1" '+(selected(i)?'selected':'')+'>作品 02</option></select></label></article>'}
function ids(){return state.focus||Array.from({length:state.count},(_,i)=>i)}
function table(full=false){const active=full?Array.from({length:state.count},(_,i)=>i):ids();return '<div class="metrics-scroll"><table class="metrics '+(full?'full ':'')+(active.length>2?'six-cols':'')+'"><thead><tr><th>评价维度</th>'+active.map(i=>'<th>'+names[i]+' <small>/ 作品 0'+(selected(i)+1)+'</small></th>').join('')+'</tr></thead><tbody><tr><td>人声表达</td>'+active.map(i=>'<td><span class="score">'+score(i)+'</span> <small>/ 10</small></td>').join('')+'</tr>'+(full?'<tr><td>配器层次</td>'+active.map(i=>'<td><span class="score">'+score(i,2)+'</span> <small>/ 10</small></td>').join('')+'</tr><tr><td>观察依据</td>'+active.map((i)=>'<td>'+(['字头清晰<br>人声更靠前','混响自然<br>空间更舒展','段落鲜明<br>节奏更直接'][(i+selected(i))%3])+'</td>').join('')+'</tr><tr><td>对应片段</td>'+active.map(()=>'<td>00:42 · 副歌</td>').join('')+'</tr>':'')+'</tbody></table></div>'}
function body(){if(state.scene===0)return '<div class="scene-summary"><div class="kicker">SHARED INPUT / '+cases[state.caseIndex]+'</div><h3>写一首'+(state.caseIndex?'清晨旷野':'城市雨夜')+'里的中文独立流行。<br>人声克制，旋律有记忆点，<br>让器乐保留呼吸的空间。</h3><div class="input-matrix"><div><small>参评对象</small><p>'+state.count+' 个工具 · 每个工具 2 份示例作品</p></div><div><small>控制条件</small><p>同一歌词、风格要求与评价维度</p></div><div><small>观察重点</small><p>人声表达 / 配器层次 / 指令遵循</p></div></div><p class="fact">同题作品在同一测试题中对照，曲名与样本选择始终可见。</p></div>';if(state.scene===2)return table(true)+'<p class="evidence">评分使用统一满分与评价口径；未评分显示「—」，不参与排序。示例数据不构成任何平台优劣结论。<br>在正式产品中，点击依据可回到对应作品和片段，演示返回时保留原来的观看位置。</p>';if(state.scene===3)return '<div class="scene-summary"><div class="kicker">FINDINGS / 示例结论</div><h3>人声的直接表达，<br>与配器的空间层次，<br>是两种不同的创作取向。</h3><div class="input-matrix"><div><small>适用场景</small><p>先明确你想强调的声音特征</p></div><div><small>证据来源</small><p>'+cases[state.caseIndex]+' · 副歌片段与维度评价</p></div><div><small>评价边界</small><p>当前样本，不代替工具整体能力</p></div></div><p class="fact">正式产品由评测者填写结论；系统负责把依据组织得清楚、好看。</p></div>';return '<div class="'+(ids().length>2?'six':'duel')+'">'+ids().map(i=>participant(i,ids().length>2)).join('')+'</div>'+(ids().length>2?'<div class="six-meta"><span>6 方总览 · 所有工具以相同尺寸呈现</span><span>试听时只突出当前对象；点击「放大」查看重点双人对比。</span></div>':table(false))}
function focusControls(){if(state.count!==6||state.scene!==1)return '<span class="stage-meta">SAME PROMPT. MORE PERSPECTIVES.</span>';return '<div class="focus-controls">'+(state.focus?'<button class="step-btn" data-overview>返回六方总览</button><label>参照 <select id="reference">'+names.map((x,i)=>i!==state.focus[0]?'<option value="'+i+'" '+(i===state.focus[1]?'selected':'')+'>'+x+'</option>':'').join('')+'</select></label>':'<span>总览 → 重点双人对比</span>')+'</div>'}
function stage(){return '<section class="stage '+(state.appearance==='paper'?'read-mode':'')+'">'+head()+'<div class="stage-content">'+heading()+body()+'</div><footer class="transport"><span class="count">0'+(state.scene+1)+' / 04 <span style="margin-left:14px">'+chapters[state.scene]+'</span></span>'+focusControls()+'<div><button class="step-btn" data-step="-1" '+(state.scene===0?'disabled':'')+'>← 上一步</button> <button class="step-btn" data-step="1" '+(state.scene===3?'disabled':'')+'>下一步 →</button></div></footer></section>'}
function inspector(){if(state.tab==='样式')return '<span class="field-label">当前场景版式</span><div class="mini-grid"><button class="selected">成对舞台</button><button>媒体 + 说明</button><button>数据比较</button><button>单项聚焦</button></div><span class="field-label">项目风格</span><div class="asset-box">墨色舞台 · 继承项目预设</div><div class="switch-row">显示歌词<button class="switch" role="switch" aria-label="显示歌词" aria-checked="true" data-switch="lyrics"></button></div><div class="switch-row">显示封面<button class="switch" role="switch" aria-label="显示封面" aria-checked="true" data-switch="cover"></button></div><p class="field-hint">布局控制在预设范围内，作品内容不随外观变化。</p>';if(state.tab==='演示')return '<span class="field-label">章节推进</span><div class="asset-box">按键 / 遥控器手动推进</div><span class="field-label">切换测试题</span><div class="asset-box">暂停当前音频，进入目标题的起始状态</div><span class="field-label">身份显示</span><div class="asset-box">本场景显示名称与版本</div><p class="field-hint">先揭示证据，再揭示身份；演示状态不会写入评测内容。</p>';return '<label class="field-label" for="edit-title">作品名称</label><input id="edit-title" value="'+title(0)+'"><span class="field-label">测试题 / 样本</span><div class="asset-box">'+cases[state.caseIndex]+' / 作品 0'+(selected(0)+1)+'</div><span class="field-label">音频素材</span><div class="asset-box"><span>'+title(0)+'.wav<small>音频、封面、歌词属于同一份样本</small></span></div><span class="field-label">评价数据</span><div class="asset-box">人声表达 <span>'+score(0)+' / 10</span></div><p class="field-hint">切换样本会同步切换其评价与关联素材，避免内容错配。</p>'}
function editor(){return '<section class="editor-shell"><header class="stage-head">'+brand()+'<span class="scene-name">音乐生成评测 / '+cases[state.caseIndex]+'</span><div class="editor-top-right"><span>已保存</span><span>预演 ↗</span></div></header><div class="editor-grid"><nav class="outline" aria-label="编辑结构"><h3>章节</h3>'+chapters.map((x,i)=>'<button data-editor-scene="'+i+'" class="'+(i===1?'selected':'')+'">0'+(i+1)+' '+x+'</button>').join('')+'<h3 style="margin-top:28px">当前题 · 样本</h3>'+names.slice(0,state.count).map((x,i)=>'<button class="nested '+(!i?'selected':'')+'">'+letters[i]+' · '+x+'</button>').join('')+'</nav><div class="preview-area"><div class="preview-label"><span>作品试听 / 样本 A</span><span>当前场景预览</span></div><div class="preview-card">'+participant(0)+'</div><p class="preview-tip">素材、评测内容与演示编排各有归属。<br>属性区保持稳定，歌词／长文本使用统一的扩展编辑器。</p></div><aside class="inspector"><h3>当前样本</h3><p>Suno / '+cases[state.caseIndex]+'</p><div class="inspector-tabs">'+['内容','样式','演示'].map(x=>'<button data-tab="'+x+'" class="'+(x===state.tab?'selected':'')+'">'+x+'</button>').join('')+'</div>'+inspector()+'<div class="inspector-bottom"><p>修改内容自动保存 · 演示操作保持临时</p></div></aside></div><footer class="editor-footer"><span>统一编辑器结构示意</span><span>← 结构 / 预览 / 属性 →</span></footer></section>'}
function render(){document.getElementById('frame').innerHTML=state.mode==='stage'?stage():editor();document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mode===state.mode));document.querySelectorAll('[data-count]').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.count===state.count));document.querySelector('#frame').firstElementChild.classList.add('changed')}
function step(d){state.scene=Math.max(0,Math.min(3,state.scene+d));state.playing=null;state.focus=null;render()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.mode){state.mode=b.dataset.mode;render()}else if(b.dataset.count){state.count=+b.dataset.count;state.focus=null;state.playing=null;render()}else if(b.dataset.scene!==undefined){state.scene=+b.dataset.scene;state.playing=null;state.focus=null;render()}else if(b.dataset.editorScene!==undefined){state.scene=+b.dataset.editorScene;state.mode='stage';render()}else if(b.dataset.step){step(+b.dataset.step)}else if(b.dataset.play!==undefined){state.playing=state.playing===+b.dataset.play?null:+b.dataset.play;render()}else if(b.dataset.focus!==undefined){let i=+b.dataset.focus;state.focus=[i,i===0?1:0];state.playing=null;render()}else if(b.hasAttribute('data-overview')){state.focus=null;state.playing=null;render()}else if(b.hasAttribute('data-case')){state.caseIndex=1-state.caseIndex;state.playing=null;render()}else if(b.dataset.tab){state.tab=b.dataset.tab;render()}else if(b.dataset.switch){let on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',on);document.querySelector(b.dataset.switch==='lyrics'?'.preview-card .lyric':'.preview-card .album').hidden=!on}});
document.addEventListener('change',e=>{if(e.target.id==='appearance'){state.appearance=e.target.value;render()}else if(e.target.dataset.sample!==undefined){state.selection[state.caseIndex+':'+e.target.dataset.sample]=+e.target.value;state.playing=null;render()}else if(e.target.id==='reference'){state.focus[1]=+e.target.value;state.playing=null;render()}});
document.addEventListener('input',e=>{if(e.target.id==='edit-title')document.querySelector('.preview-card .album-title').textContent=e.target.value});
document.addEventListener('keydown',e=>{if(state.mode!=='stage'||e.repeat||e.isComposing||e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,textarea,select,button,[contenteditable=true]'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();step(1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();step(-1)}else if(e.key.toLowerCase()==='p'&&state.scene===1){e.preventDefault();state.playing=state.playing===null?(ids().includes(state.currentObject)?state.currentObject:ids()[0]):null;render()}else if(/^[1-6]$/.test(e.key)&&+e.key<=state.count){state.currentObject=+e.key-1;document.querySelectorAll('.competitor').forEach((x,i)=>x.classList.toggle('focus',ids()[i]===state.currentObject))}else if(e.key==='Escape'&&state.focus){state.focus=null;state.playing=null;render()}});render();
</script></body></html>
