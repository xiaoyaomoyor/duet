<!doctype html>
<html lang="zh-CN" data-theme="violet-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />

    <title>对奏 Duet · 让两个工具，同台演奏同一道题</title>
    <meta
      name="description"
      content="对奏 Duet — 专注内容横向对比的本地优先 Web 应用。同一套提示词，两个工具的产出并置对照：音乐、视频、图片、3D、音频、代码，皆可同台。"
    />
    <meta name="author" content="xiaoyaomoyor" />

    <!-- 内联 favicon：避免额外请求，也让 file:// 与 Tauri 下同样可用 -->

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23150F26'/%3E%3Cpath d='M12 4.5v15' stroke='%236B57B5' stroke-width='1.2'/%3E%3Crect x='4' y='8.4' width='3.4' height='7.2' rx='1.1' fill='%23A78BFA'/%3E%3Crect x='8.6' y='10.2' width='2.4' height='3.6' rx='0.9' fill='%237C5CE0'/%3E%3Crect x='16.6' y='8.4' width='3.4' height='7.2' rx='1.1' fill='%2322D3EE'/%3E%3Crect x='13' y='10.2' width='2.4' height='3.6' rx='0.9' fill='%231B93AC'/%3E%3C/svg%3E"
    />

    <!-- 主题色：移动端浏览器地址栏与 PWA 一致 -->
    <meta name="theme-color" content="#0b0714" />

    <script>
      // 首帧防闪白：在 CSS 加载前先把底色铺上
      document.documentElement.style.backgroundColor = '#0b0714'
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 24px; color: #f3effb; background: #0b0714; font-family: sans-serif">
        对奏 Duet 需要启用 JavaScript 才能运行。
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
